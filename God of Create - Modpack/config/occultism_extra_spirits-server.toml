	#Max number of recipes that Tier 5 (Celestial) Crystallizer Spirits make per operation.
	# Default: 1
	# Range: 1 ~ 64
	tier5CrystallizerOperationCount = 1
	#The multiplier to each smelting recipe's cooking_time for Tier 5 (Celestial) Smelter Spirits.
