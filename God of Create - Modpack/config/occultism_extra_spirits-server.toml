#Spirit Job Settings
[spirit_job]
	#The multiplier to each crushing recipe's crushing_time for Tier 5 (Celestial) Crusher Spirits.
	# Default: 0.001
	# Range: 0.0 ~ 1.7976931348623157E308
	tier5CrusherTimeMultiplier = 0.001
	#The multiplier to each crushing recipe's output count for Tier 5 (Celestial) Crusher Spirits.
	# Default: 3.5
	# Range: 0.0 ~ 1.7976931348623157E308
	tier5CrusherOutputMultiplier = 3.5
	#Max number of recipes that Tier 5 (Celestial) Crusher Spirits make per operation.
	# Default: 1
	# Range: 1 ~ 64
	tier5CrusherOperationCount = 1
	#The multiplier to each crystallize recipe's crystallize_time for Tier 5 (Celestial) Crystallizer Spirits.
	# Default: 5.0E-4
	# Range: 0.0 ~ 1.7976931348623157E308
